<header class="cabecalho" [class.interna]="!telaInicial">
  <img class="logo" src="assets/logo.png" alt="FEMA" />

  @if (!telaInicial) {
    <a class="link" [routerLink]="voltar"
      ><img class="seta" src="assets/arrow-left.png" alt="" />Voltar</a
    >
  }

  <img class="banner" [src]="bannerSrc" alt="" />
  <h1 class="titulo">
    @if (telaInicial) {
      Organize, <span>conecte,</span> simplifique
    } @else {
      {{ titulo }}
    }
  </h1>
</header>
