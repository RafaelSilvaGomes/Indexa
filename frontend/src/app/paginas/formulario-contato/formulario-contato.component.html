<app-container>
  <app-cabecalho
    [bannerSrc]="'assets/adicionar-contato.png'"
    [titulo]="titulo"
    [voltar]="voltar"
  ></app-cabecalho>

  <form [formGroup]="contatoForm" (ngSubmit)="salvarContato()">
    <label class="imagem-contato" for="imagem">
      @if (imagem) {
        <img [src]="imagem" alt="Foto do contato" />
      } @else {
        <span>＋</span>
        <small>Adicione a imagem do contato</small>
      }
    </label>
    <input
      class="arquivo"
      id="imagem"
      type="file"
      accept="image/*"
      (change)="selecionarImagem($event)"
    />

    <label for="nome">Nome</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite o nome do contato"
      formControlName="nome"
    />
    <app-mensagem-erro [control]="obterControle('nome')"></app-mensagem-erro>

    <label for="telefone">Telefone</label>
    <input
      type="tel"
      id="telefone"
      placeholder="Digite o telefone do contato"
      formControlName="telefone"
    />
    <app-mensagem-erro
      [control]="obterControle('telefone')"
    ></app-mensagem-erro>

    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      placeholder="Digite o e-mail do contato"
      formControlName="email"
    />
    <app-mensagem-erro [control]="obterControle('email')"></app-mensagem-erro>

    <hr />
    <label for="aniversario">Aniversário</label>
    <input type="date" id="aniversario" formControlName="aniversario" />

    <label for="redes">Redes sociais</label>
    <div class="input-container">
      <span class="span-http">http://</span>
      <input
        type="url"
        id="redes"
        placeholder="Adicione a URL da página"
        formControlName="redes"
      />
    </div>

    <label for="observacoes">Observações</label>
    <textarea
      id="observacoes"
      placeholder="Coloque observações nesse espaço. Exemplo: 'Instrutora da academia', 'Nova Imagem', amiga da Júlia."
      formControlName="observacoes"
    ></textarea>

    @if (erro) {
      <p class="erro-formulario">{{ erro }}</p>
    }
    <section class="botoes">
      <button class="botao-cancelar" type="button" (click)="cancelar()">
        Cancelar
      </button>
      <button
        class="botao-salvar"
        type="submit"
        [disabled]="contatoForm.invalid || salvando"
      >
        Salvar contato
      </button>
    </section>
  </form>
</app-container>
