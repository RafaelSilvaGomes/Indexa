<app-container>
  <main class="pagina-interna">
    <app-cabecalho
      bannerSrc="assets/perfil-contato.png"
      titulo="Perfil do contato"
    ></app-cabecalho>

    <p class="mensagem erro" *ngIf="erro">{{ erro }}</p>
    <article class="cartao-perfil" *ngIf="contato as pessoa">
      <div class="perfil-topo">
        <img
          [src]="pessoa.imagem || 'assets/adicionar-contato.png'"
          alt="Foto do contato"
        />
        <strong>{{ pessoa.nome }}</strong>
      </div>
      <div class="dados-perfil">
        <div>
          <b>♧ Número</b><span>{{ pessoa.telefone }}</span>
        </div>
        <div>
          <b>✉ E-mail</b><span>{{ pessoa.email }}</span>
        </div>
        <div *ngIf="pessoa.aniversario">
          <b>▣ Data de nascimento</b><span>{{ data(pessoa.aniversario) }}</span>
        </div>
        <div *ngIf="pessoa.redes">
          <b>◉ Redes sociais</b><span>{{ pessoa.redes }}</span>
        </div>
        <div *ngIf="pessoa.observacoes">
          <b>Observações</b><span>{{ pessoa.observacoes }}</span>
        </div>
      </div>
      <div class="botoes">
        <button class="botao-cancelar" type="button" (click)="excluir()">
          Excluir contato
        </button>
        <a class="botao-salvar" [routerLink]="['/formulario', pessoa.id]"
          >Editar</a
        >
      </div>
    </article>
  </main>
</app-container>
